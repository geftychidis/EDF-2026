<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>IKH Proposals — Mobile</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --panel2:#1c2330; --line:#2b3343;
    --ink:#e8eef5; --mute:#9aa6b2; --accent:#4ea1ff;
    --coord:#ff4d4d; --partner:#7dd3fc; --chip:#26303f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
  body{
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust:100%
  }
  button,a,input,select{-webkit-tap-highlight-color:rgba(78,161,255,.35);touch-action:manipulation;font-family:inherit}
  button{background:transparent;color:inherit;border:0;padding:0;margin:0;cursor:pointer;font-size:inherit;-webkit-appearance:none;appearance:none}

  header{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .titlebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:600}
  .sub{color:var(--mute);font-size:12px;margin-top:2px}

  /* Diagnostic badge */
  .diag{display:flex;gap:6px;align-items:center}
  .badge-dot{font-size:11px;padding:4px 9px;border-radius:11px;background:#3a1010;color:#ff8a8a;border:1px solid #5a1818;white-space:nowrap}
  .badge-dot.ok{background:#10301c;color:#90f2b4;border-color:#185a2e}

  .tabs{display:flex;gap:8px;margin-top:12px}
  .tabs button{flex:1;background:var(--panel);border:1px solid var(--line);padding:13px;border-radius:10px;font-size:15px;font-weight:600;min-height:50px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#06121f}

  main{padding:14px 14px 80px;max-width:760px;margin:0 auto}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 6px}
  .lbl:first-child{margin-top:0}
  .row{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:11px 15px;border-radius:24px;background:var(--chip);border:1px solid var(--line);
        font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;line-height:1;color:var(--ink)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
  .chip:active{transform:scale(.96)}
  .chip .n{opacity:.8;font-size:11px;background:rgba(0,0,0,.2);padding:2px 7px;border-radius:10px}

  input[type=search],select{
    width:100%;padding:12px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-size:16px;min-height:48px
  }
  input::placeholder{color:var(--mute)}

  .stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--mute)}
  .stat b{color:var(--ink);font-size:15px;margin-right:5px}

  .role-coord{color:var(--coord);font-weight:800}
  .role-partner{color:var(--partner)}
  .coord-strong{color:var(--coord);font-weight:800}

  .badge{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11px;border:1px solid var(--line);
        background:var(--panel2);color:var(--mute);margin:0 4px 4px 0;white-space:nowrap;line-height:1.3}
  .badge.smero{background:#3a2c10;color:#ffd58a;border-color:#5a4318}
  .badge.da{background:#10303a;color:#8fe3f2;border-color:#1a4654}
  .badge.cl3{background:#3a103a;color:#f29bf2;border-color:#54185a}
  .badge.cl4{background:#103a1c;color:#90f2b4;border-color:#185a2e}
  .badge.edf{background:#1a2b54;color:#a9c4ff;border-color:#2a4080}

  .muted{color:var(--mute);font-size:12px}

  /* proposal card */
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .pcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
  .ptitle{font-size:16px;font-weight:700;line-height:1.3;flex:1}
  .pnum{background:var(--panel2);color:var(--mute);border:1px solid var(--line);padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;flex-shrink:0}
  .pfield{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
  .pfield:first-of-type{border-top:0;padding-top:0}
  .pfield .k{color:var(--mute);min-width:104px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px}
  .pfield .v{flex:1;min-width:0;word-wrap:break-word;overflow-wrap:anywhere}
  .topic-link{color:var(--accent);font-size:13.5px;text-decoration:none;display:inline-block;padding:8px 0;min-height:40px;word-break:break-all;line-height:1.4}

  /* people card */
  .grid{display:grid;grid-template-columns:1fr;gap:10px}
  .pcard h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .pcard .count{background:var(--chip);color:var(--mute);font-size:12px;padding:3px 10px;border-radius:12px}
  .pcard ul{margin:0;padding:0;list-style:none}
  .pcard ul li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .pcard ul li:first-child{border-top:0}

  .hidden{display:none !important}
  .empty{padding:30px 16px;text-align:center;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:12px}

  .legend{font-size:12px;color:var(--mute);margin-top:10px;line-height:1.5}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}

  @media (min-width:760px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <div>
      <h1>IKH — Proposals</h1>
      <div class="sub">EDF 2026 &amp; Horizon Europe security calls</div>
    </div>
    <div class="diag">
      <span id="jsBadge" class="badge-dot">✗ JS off</span>
      <span id="tapBadge" class="badge-dot ok">taps: 0</span>
    </div>
  </div>
  <div class="tabs">
    <button id="tab-prop" type="button" class="active" onclick="switchView('prop')">Proposals</button>
    <button id="tab-people" type="button" onclick="switchView('people')">Ποιος σε ποια</button>
  </div>
</header>

<main>

<section id="view-prop">

  <div class="panel">
    <div class="lbl">Κατηγορία topic</div>
    <div class="row" id="catRow">
      <button type="button" class="chip active" data-cat="ALL"    onclick="setCat('ALL', this)">Όλες <span class="n" id="n-all"></span></button>
      <button type="button" class="chip"        data-cat="SMERO"  onclick="setCat('SMERO', this)">SMERO <span class="n" id="n-SMERO"></span></button>
      <button type="button" class="chip"        data-cat="EDF-DA" onclick="setCat('EDF-DA', this)">EDF DA <span class="n" id="n-EDF-DA"></span></button>
      <button type="button" class="chip"        data-cat="EDF"    onclick="setCat('EDF', this)">EDF 2026 <span class="n" id="n-EDF"></span></button>
      <button type="button" class="chip"        data-cat="CL3"    onclick="setCat('CL3', this)">CL3 Sec. <span class="n" id="n-CL3"></span></button>
      <button type="button" class="chip"        data-cat="CL4"    onclick="setCat('CL4', this)">CL4 Digital <span class="n" id="n-CL4"></span></button>
    </div>

    <div class="lbl">Ρόλος ΙΚΗ</div>
    <div class="row" id="roleRow">
      <button type="button" class="chip active" data-role="ALL"         onclick="setRole('ALL', this)">Όλοι</button>
      <button type="button" class="chip"        data-role="Coordinator" onclick="setRole('Coordinator', this)">ΙΚΗ coordinator</button>
      <button type="button" class="chip"        data-role="Partner"     onclick="setRole('Partner', this)">ΙΚΗ partner</button>
    </div>

    <div class="lbl">Άτομο</div>
    <select id="personFilter" onchange="setPerson(this.value)">
      <option value="">— οποιοσδήποτε —</option>
    </select>

    <div class="lbl">Αναζήτηση</div>
    <input type="search" id="q" oninput="setQ(this.value)" placeholder="τίτλος, coordinator, topic…">

    <div class="stats" id="stats"></div>
    <div class="legend">
      <span class="swatch" style="background:var(--coord)"></span>ΙΚΗ coordinator (κόκκινο, bold)
      &nbsp;·&nbsp;
      <span class="swatch" style="background:var(--partner)"></span>ΙΚΗ partner
    </div>
  </div>

  <div id="propCards"></div>
  <div class="empty hidden" id="empty">Δεν υπάρχουν προτάσεις με αυτά τα φίλτρα.</div>
</section>

<section id="view-people" class="hidden">
  <div class="panel">
    <div class="lbl">Δείξε</div>
    <div class="row" id="proleRow">
      <button type="button" class="chip active" data-prole="ALL"         onclick="setProle('ALL', this)">Όλες</button>
      <button type="button" class="chip"        data-prole="Coordinator" onclick="setProle('Coordinator', this)">Μόνο ΙΚΗ-coord</button>
      <button type="button" class="chip"        data-prole="Partner"     onclick="setProle('Partner', this)">Μόνο ΙΚΗ-partner</button>
    </div>
    <div class="legend">Προτάσεις όπου η ΙΚΗ είναι coordinator: <span class="coord-strong">κόκκινα &amp; bold</span>.</div>
  </div>
  <div class="grid" id="peopleGrid"></div>
</section>

</main>

<script>
"use strict";

var CONTRIBUTORS = ["Άγγελος","Πάνος","Καμπάς","Καγκέλης","Γκότσης","Σοφία","Χασιώτης","Ευτυχίδης","Κατερίνα","Έλσερ","AUX2"];

function topic(id){return "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/topic-details/" + id.toLowerCase();}
var EDFwp = "https://defence-industry-space.ec.europa.eu/document/download/2cd25753-d14f-4019-8fdf-68cca55b7f17_en?filename=EDF+2026+Call+Topic+Descriptions.pdf";
var CL4wp = "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/calls-for-proposals?frameworkProgramme=43108390&keywords=HORIZON-CL4-2026";

var PROPOSALS = [
 {num:1, title:"Myrmedon (AISAP call)",       role:"Coordinator", other:"Καμπάς",            category:"EDF",    topicCode:"EDF-2026-LS-RA-CHALLENGE-DIGIT-AISAP",        topicUrl:topic("EDF-2026-LS-RA-CHALLENGE-DIGIT-AISAP"),   people:["Καμπάς","Χασιώτης"]},
 {num:"",title:"MDOC",                        role:"Partner",     other:"",                  category:"EDF-DA", topicCode:"EDF-2026-DA-EXP-DIGIT-MDOC",                  topicUrl:topic("EDF-2026-DA-EXP-DIGIT-MDOC"),             people:["Χασιώτης"]},
 {num:2, title:"EPHEMERON (AURAS SMERO call)",role:"Coordinator", other:"Καγκέλης",          category:"SMERO",  topicCode:"EDF-2026-LS-DIS-RA-SMERO-NT",                 topicUrl:topic("EDF-2026-LS-DIS-RA-SMERO-NT"),            people:["Καγκέλης","Γκότσης"]},
 {num:3, title:"MANTA Subsea SMERO",          role:"Coordinator", other:"Πάνος (Δημακόπουλος)",category:"SMERO",topicCode:"EDF-2026-LS-DIS-RA-SMERO-NT",                 topicUrl:topic("EDF-2026-LS-DIS-RA-SMERO-NT"),            people:["Πάνος","Σοφία"]},
 {num:4, title:"SMERO NEPTUNEYE",             role:"Coordinator", other:"Σοφία",             category:"SMERO",  topicCode:"EDF-2026-LS-DIS-RA-SMERO-NT",                 topicUrl:topic("EDF-2026-LS-DIS-RA-SMERO-NT"),            people:["Καμπάς","Σοφία","Ευτυχίδης"]},
 {num:5, title:"AWC (DA) (STAM)",             role:"Partner",     other:"STAM",              category:"EDF-DA", topicCode:"EDF-2026-DA-ENERENV-AWC",                     topicUrl:topic("EDF-2026-DA-ENERENV-AWC"),                people:["Πάνος"]},
 {num:6, title:"SMERO 6g-ATLAS (DA)",         role:"Partner",     other:"Ubiteq",            category:"SMERO",  topicCode:"EDF-2026-LS-DA-SME-NT",                       topicUrl:topic("EDF-2026-LS-DA-SME-NT"),                  people:["Κατερίνα"]},
 {num:7, title:"SMERO PQ INSTINCT (DA)",      role:"Partner",     other:"Ubiteq",            category:"SMERO",  topicCode:"EDF-2026-LS-DA-SME-NT",                       topicUrl:topic("EDF-2026-LS-DA-SME-NT"),                  people:[]},
 {num:"",title:"SIMTRAIN (EBOS)",             role:"Partner",     other:"EBOS",              category:"EDF",    topicCode:"EDF-2026-RA-SIMTRAIN-MSAI",                   topicUrl:topic("EDF-2026-RA-SIMTRAIN-MSAI"),              people:[]},
 {num:8, title:"SMERO AQUILA (DA)",           role:"Partner",     other:"Ubiteq",            category:"SMERO",  topicCode:"EDF-2026-LS-DA-SME-NT",                       topicUrl:topic("EDF-2026-LS-DA-SME-NT"),                  people:["Ευτυχίδης"]},
 {num:9, title:"Humanoid",                    role:"Coordinator", other:"Πάνος (Δημακόπουλος)",category:"EDF",  topicCode:"EDF-2026 (humanoid — TBD, βλ. WP PDF)",       topicUrl:EDFwp,                                            people:["Άγγελος","Πάνος"]},
 {num:"",title:"CBRN",                        role:"Partner",     other:"ait / iccs",        category:"EDF",    topicCode:"EDF-2026-RA-MCBRN-DST",                       topicUrl:topic("EDF-2026-RA-MCBRN-DST"),                  people:["Καγκέλης","Ευτυχίδης"]},
 {num:"",title:"Morpheus",                    role:"Partner",     other:"",                  category:"EDF",    topicCode:"EDF-2026 (Morpheus — TBD, βλ. WP PDF)",       topicUrl:EDFwp,                                            people:["AUX2"]},
 {num:10,title:"SMERO SBUV-COM",              role:"Coordinator", other:"TBD",               category:"SMERO",  topicCode:"EDF-2026-LS-DIS-RA-SMERO-NT",                 topicUrl:topic("EDF-2026-LS-DIS-RA-SMERO-NT"),            people:["Χασιώτης"]},
 {num:11,title:"3D Sentinel",                 role:"Coordinator", other:"Έλσερ",             category:"EDF",    topicCode:"EDF-2026-LS-DA-DIS-OTHR",                     topicUrl:topic("EDF-2026-LS-DA-DIS-OTHR"),                people:["Καμπάς","Καγκέλης","Σοφία","Έλσερ"]},
 {num:"",title:"Labora (CL4) — submitted",    role:"Partner",     other:"Sapienza University of Rome", category:"CL4", topicCode:"HORIZON-CL4-2026 (Digital)",            topicUrl:CL4wp,                                            people:["Χασιώτης"]},
 {num:"",title:"OASI",                        role:"Partner",     other:"shadow by Ilias",   category:"EDF",    topicCode:"EDF-2026 (OASI — TBD, βλ. WP PDF)",           topicUrl:EDFwp,                                            people:[]},
 {num:"",title:"MBT",                         role:"Partner",     other:"",                  category:"EDF-DA", topicCode:"EDF-2026-DA-GROUND-MBT",                      topicUrl:topic("EDF-2026-DA-GROUND-MBT"),                 people:[]},
 {num:12,title:"STORM (Cyric)",               role:"Partner",     other:"Cyric",             category:"EDF",    topicCode:"EDF-2026 (STORM — TBD, βλ. WP PDF)",          topicUrl:EDFwp,                                            people:["Άγγελος"]},
 {num:13,title:"SKACHI (EBOS)",               role:"Partner",     other:"EBOS",              category:"EDF",    topicCode:"EDF-2026 (SKACHI — TBD, βλ. WP PDF)",         topicUrl:EDFwp,                                            people:["Χασιώτης"]},
 {num:14,title:"Info dominance (resub.)",     role:"Partner",     other:"",                  category:"EDF",    topicCode:"EDF-2026-LS-DA-DIS-OTHR",                     topicUrl:topic("EDF-2026-LS-DA-DIS-OTHR"),                people:["Σοφία"]},
 {num:"",title:"BM-01-01",                    role:"Partner",     other:"IANUS (?)",         category:"CL3",    topicCode:"HORIZON-CL3-2026-01-BM-01",                   topicUrl:topic("HORIZON-CL3-2026-01-BM-01"),              people:[]},
 {num:"",title:"SMERO IANUS",                 role:"Partner",     other:"",                  category:"SMERO",  topicCode:"EDF-2026-LS-DIS-RA-SMERO-NT",                 topicUrl:topic("EDF-2026-LS-DIS-RA-SMERO-NT"),            people:["Σοφία","Ευτυχίδης"]},
 {num:"",title:"DRS-03",                      role:"Partner",     other:"ETRA",              category:"CL3",    topicCode:"HORIZON-CL3-2026-01-DRS-03",                  topicUrl:topic("HORIZON-CL3-2026-01-DRS-03"),             people:["Χασιώτης","Ευτυχίδης"]},
 {num:15,title:"KOUTRAS Underwater CSBI",     role:"Partner",     other:"",                  category:"EDF",    topicCode:"EDF-2026-LS-RA-SI-UWW-CSBI",                  topicUrl:topic("EDF-2026-LS-RA-SI-UWW-CSBI"),             people:["Καμπάς"]},
 {num:16,title:"HSM4COM (DA) TELELET",        role:"Partner",     other:"TELELET",           category:"EDF-DA", topicCode:"EDF-2026-DA-PROTMOB-DMM",                     topicUrl:topic("EDF-2026-DA-PROTMOB-DMM"),                people:["Κατερίνα"]},
 {num:17,title:"Poikilos",                    role:"Coordinator", other:"Κατερίνα",          category:"EDF",    topicCode:"EDF-2026 (Poikilos — TBD, βλ. WP PDF)",       topicUrl:EDFwp,                                            people:["Κατερίνα"]},
 {num:18,title:"Equity resubmission (T4i)",   role:"Partner",     other:"T4i",               category:"EDF",    topicCode:"EDF-2026 EUDIS Equity Facility",              topicUrl:EDFwp,                                            people:["Καμπάς"]},
 {num:19,title:"GEOAI",                       role:"Partner",     other:"",                  category:"EDF",    topicCode:"EDF-2026 (GEOAI — TBD, βλ. WP PDF)",          topicUrl:EDFwp,                                            people:["Καμπάς","Κατερίνα"]}
];

var CAT_LABEL = {
  "SMERO":  {cls:"smero", label:"SMERO"},
  "EDF-DA": {cls:"da",    label:"EDF DA"},
  "EDF":    {cls:"edf",   label:"EDF 2026"},
  "CL3":    {cls:"cl3",   label:"H2020 / CL3"},
  "CL4":    {cls:"cl4",   label:"Horizon CL4"}
};

var state = {cat:"ALL", role:"ALL", q:"", person:"", prole:"ALL", tapCount:0};

function esc(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function tapped(){
  state.tapCount++;
  var b = document.getElementById("tapBadge");
  if(b) b.textContent = "taps: " + state.tapCount;
}

function setCat(v, btn){
  tapped();
  state.cat = v;
  var arr = document.querySelectorAll("#catRow .chip");
  for(var i=0;i<arr.length;i++) arr[i].classList.remove("active");
  if(btn) btn.classList.add("active");
  render();
}
function setRole(v, btn){
  tapped();
  state.role = v;
  var arr = document.querySelectorAll("#roleRow .chip");
  for(var i=0;i<arr.length;i++) arr[i].classList.remove("active");
  if(btn) btn.classList.add("active");
  render();
}
function setProle(v, btn){
  tapped();
  state.prole = v;
  var arr = document.querySelectorAll("#proleRow .chip");
  for(var i=0;i<arr.length;i++) arr[i].classList.remove("active");
  if(btn) btn.classList.add("active");
  renderPeople();
}
function setPerson(v){ state.person = v; render(); }
function setQ(v){ state.q = v; render(); }

function switchView(v){
  tapped();
  document.getElementById("tab-prop").classList.toggle("active", v==="prop");
  document.getElementById("tab-people").classList.toggle("active", v==="people");
  document.getElementById("view-prop").classList.toggle("hidden", v!=="prop");
  document.getElementById("view-people").classList.toggle("hidden", v!=="people");
  if(v==="people") renderPeople();
}

function filtered(){
  var rows = PROPOSALS.slice();
  if(state.cat !== "ALL") rows = rows.filter(function(p){return p.category===state.cat;});
  if(state.role !== "ALL") rows = rows.filter(function(p){return p.role===state.role;});
  if(state.person) rows = rows.filter(function(p){return p.people.indexOf(state.person)>=0;});
  if(state.q){
    var q = state.q.toLowerCase();
    rows = rows.filter(function(p){
      return (p.title||"").toLowerCase().indexOf(q)>=0
          || (p.other||"").toLowerCase().indexOf(q)>=0
          || (p.topicCode||"").toLowerCase().indexOf(q)>=0
          || p.people.join(" ").toLowerCase().indexOf(q)>=0;
    });
  }
  rows.sort(function(a,b){
    var an = a.num===""?9999:Number(a.num), bn = b.num===""?9999:Number(b.num);
    return an-bn;
  });
  return rows;
}

function coordHtml(p){
  if(!p.other) return '<span class="muted">—</span>';
  return p.role==="Coordinator"
    ? '<span class="role-coord">'+esc(p.other)+'</span><span class="muted"> · IKH</span>'
    : esc(p.other);
}

function render(){
  var rows = filtered();
  var wrap = document.getElementById("propCards");
  var html = "";
  for(var i=0;i<rows.length;i++){
    var p = rows[i];
    var catMeta = CAT_LABEL[p.category] || {cls:"edf", label:"EDF"};
    var roleCls = p.role === "Coordinator" ? "role-coord" : "role-partner";
    var pb = "";
    if(p.people.length){
      for(var j=0;j<p.people.length;j++) pb += '<span class="badge">'+esc(p.people[j])+'</span>';
    } else {
      pb = '<span class="muted">— καμία ένδειξη —</span>';
    }
    html +=
      '<div class="pcard">' +
        '<div class="pcard-h">' +
          '<div class="ptitle">'+esc(p.title)+'</div>' +
          '<div class="pnum">'+(p.num===""?"—":"#"+p.num)+'</div>' +
        '</div>' +
        '<div class="pfield"><div class="k">Ρόλος ΙΚΗ</div><div class="v '+roleCls+'">'+p.role+'</div></div>' +
        '<div class="pfield"><div class="k">Coordinator</div><div class="v">'+coordHtml(p)+'</div></div>' +
        '<div class="pfield"><div class="k">Topic / call</div><div class="v">' +
          '<span class="badge '+catMeta.cls+'">'+catMeta.label+'</span><br>' +
          '<a class="topic-link" href="'+p.topicUrl+'" target="_blank" rel="noopener">'+esc(p.topicCode)+' ↗</a>' +
        '</div></div>' +
        '<div class="pfield"><div class="k">Contributors</div><div class="v">'+pb+'</div></div>' +
      '</div>';
  }
  wrap.innerHTML = html;
  document.getElementById("empty").classList.toggle("hidden", rows.length>0);

  var coord=0, partner=0;
  for(var k=0;k<rows.length;k++){ if(rows[k].role==="Coordinator") coord++; else partner++; }
  document.getElementById("stats").innerHTML =
    '<div class="stat"><b>'+rows.length+'</b>εμφανίζονται</div>' +
    '<div class="stat"><b style="color:var(--coord)">'+coord+'</b>ΙΚΗ coord</div>' +
    '<div class="stat"><b style="color:var(--partner)">'+partner+'</b>ΙΚΗ partner</div>';
}

function renderPeople(){
  var grid = document.getElementById("peopleGrid");
  var html = "";
  for(var i=0;i<CONTRIBUTORS.length;i++){
    var person = CONTRIBUTORS[i];
    var mine = PROPOSALS.filter(function(p){return p.people.indexOf(person)>=0;});
    if(state.prole!=="ALL") mine = mine.filter(function(p){return p.role===state.prole;});
    if(mine.length===0){
      html += '<div class="pcard"><h3>'+esc(person)+' <span class="count">0</span></h3><div class="muted">Καμία πρόταση'+(state.prole!=="ALL"?" ως "+state.prole.toLowerCase():"")+'.</div></div>';
      continue;
    }
    mine.sort(function(a,b){return (a.role==="Coordinator"?-1:1) - (b.role==="Coordinator"?-1:1);});
    var items = "";
    for(var j=0;j<mine.length;j++){
      var p = mine[j];
      var cls = p.role==="Coordinator" ? "coord-strong" : "";
      var catMeta = CAT_LABEL[p.category] || {cls:"edf",label:"EDF"};
      items += '<li><span class="'+cls+'">'+esc(p.title)+'</span><span class="badge '+catMeta.cls+'">'+catMeta.label+'</span></li>';
    }
    html += '<div class="pcard"><h3>'+esc(person)+' <span class="count">'+mine.length+'</span></h3><ul>'+items+'</ul></div>';
  }
  grid.innerHTML = html;
}

function init(){
  var b = document.getElementById("jsBadge");
  if(b){ b.textContent = "✓ JS active"; b.classList.add("ok"); }

  var c = {ALL:PROPOSALS.length, "SMERO":0,"EDF-DA":0,"EDF":0,"CL3":0,"CL4":0};
  for(var i=0;i<PROPOSALS.length;i++){ c[PROPOSALS[i].category] = (c[PROPOSALS[i].category]||0)+1; }
  var elAll = document.getElementById("n-all"); if(elAll) elAll.textContent = c.ALL;
  ["SMERO","EDF-DA","EDF","CL3","CL4"].forEach(function(k){
    var el = document.getElementById("n-"+k); if(el) el.textContent = c[k]||0;
  });

  var sel = document.getElementById("personFilter");
  for(var j=0;j<CONTRIBUTORS.length;j++){
    var o = document.createElement("option"); o.value=CONTRIBUTORS[j]; o.textContent=CONTRIBUTORS[j]; sel.appendChild(o);
  }

  render();
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
</body>
</html>
